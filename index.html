<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据库甘特图</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="toolbar__identity">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 6.5h7v3H4zm4 5h9v3H8zm-4 5h15v3H4z"/></svg>
        </span>
        <div class="toolbar__heading">
          <div class="toolbar__title" data-role="name">数据库甘特图</div>
          <div class="toolbar__meta">
            <span data-role="count">尚未连接数据库</span>
            <span class="meta-separator">·</span>
            <span data-role="range">配置后显示时间范围</span>
          </div>
        </div>
      </div>

      <div class="segmented" aria-label="时间缩放">
        <button class="segmented__item" data-scale="week" type="button">周</button>
        <button class="segmented__item" data-scale="month" type="button">月</button>
      </div>

      <div class="toolbar__actions">
        <button class="today-button" data-action="today" type="button" aria-label="定位到今天" title="定位到今天">今天</button>
        <button class="icon-button" data-action="refresh" type="button" aria-label="刷新" title="刷新数据">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
        <button class="icon-button" data-action="settings" type="button" aria-label="配置" title="甘特图配置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="settings-panel" data-role="settings">
      <div class="settings-inline">
        <label class="field field--source">
          <span class="field__label">数据库 ID</span>
          <input class="input input--mono" data-role="source" placeholder="AV ID 或数据库块 ID">
        </label>

        <div class="connection-control">
          <span class="field__label">数据源</span>
          <div class="connection-row">
            <button class="button button--secondary" data-action="load" type="button">读取字段</button>
            <span class="connection-state" data-role="connection">未连接</span>
          </div>
        </div>

        <label class="field">
          <span class="field__label">任务标题</span>
          <select class="select" data-role="title" disabled></select>
        </label>
        <label class="field">
          <span class="field__label">开始日期</span>
          <select class="select" data-role="start" disabled></select>
        </label>
        <label class="field">
          <span class="field__label">结束日期</span>
          <select class="select" data-role="end" disabled></select>
        </label>
        <label class="field">
          <span class="field__label">完成情况</span>
          <select class="select" data-role="progress" disabled></select>
        </label>
        <label class="field">
          <span class="field__label">紧急程度</span>
          <select class="select" data-role="urgency" disabled></select>
        </label>

        <div class="settings-inline__actions">
          <button class="button button--quiet" data-action="settings" type="button">取消</button>
          <button class="button button--primary" data-action="save" type="button" disabled>保存</button>
        </div>
      </div>
    </section>

    <div class="status" data-role="status" hidden></div>
    <button class="period-nav period-nav--prev" data-action="period-prev" type="button" aria-label="上一周期" title="上一周期">
      <svg viewBox="0 0 24 24"><path d="m15.4 5.4-1.4-1.4-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
    </button>
    <button class="period-nav period-nav--next" data-action="period-next" type="button" aria-label="下一周期" title="下一周期">
      <svg viewBox="0 0 24 24"><path d="m8.6 18.6 1.4 1.4 8-8-8-8-1.4 1.4 6.6 6.6z"/></svg>
    </button>
    <section class="chart" data-role="chart">
      <div class="empty">
        <div class="empty__visual" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <strong>连接一个思源数据库</strong>
        <p>设置数据库 ID 和日期字段后，任务会在这里按时间排布。</p>
        <button class="button button--primary" data-action="settings" type="button">开始配置</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
